<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Wallpaper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #media {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; /* 铺满且不变形 */
    display: none;
  }
  #err {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-family: sans-serif; font-size: 15px;
    display: none; text-align: center;
  }
</style>
</head>
<body>
  <video id="media" autoplay muted loop playsinline></video>
  <img id="img" style="display:none" />
  <div id="err">无法加载该内容，请检查文件是否存在或路径是否正确</div>
<script>
  // 由 main 进程通过 loadFile(?type=..&src=..) 传入
  const params = new URLSearchParams(location.search)
  const type = params.get('type')
  const src = (params.get('src') || '').trim()

  // 本地路径 -> file:/// 地址（处理空格/中文/反斜杠）
  function toFileUrl(p) {
    if (/^https?:\/\//i.test(p)) return p
    const abs = p.replace(/\\/g, '/')          // C:\a\b -> C:/a/b
    const i = abs.indexOf('/')
    const drive = abs.slice(0, i)              // C:
    const rest = abs.slice(i + 1).split('/').map(encodeURIComponent).join('/')
    return 'file:///' + drive + '/' + rest
  }

  const url = toFileUrl(src)

  if (type === 'video') {
    const v = document.getElementById('media')
    v.style.display = 'block'
    v.src = url
    v.play().catch(e => console.warn('[media] video play failed:', e))
  } else if (type === 'image') {
    const im = document.getElementById('img')
    im.style.display = 'block'
    im.onerror = () => { document.getElementById('err').style.display = 'block' }
    im.src = url
  } else {
    document.getElementById('err').style.display = 'block'
  }

  // 窗口尺寸变化时无需特殊处理：CSS 已铺满
</script>
</body>
</html>
